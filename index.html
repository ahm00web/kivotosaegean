document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

etter-spacing:.3em;text-transform:uppercase;color:#8A6A3A;font-weight:600\">About the agency<\u002Fp>\n      <h2 id=\"about-h\" data-reveal=\"up\" data-delay=\"100\" style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(40px,4.6vw,68px);line-height:1;color:#0D1B2A;text-wrap:balance\">Celebrating 27 years of <em style=\"color:#1F5C8A\">moments that matter<\u002Fem><\u002Fh2>\n      <div data-reveal=\"up\" data-delay=\"200\" style=\"margin-top:32px;display:flex;flex-direction:column;gap:18px;font-size:16px;line-height:1.75;color:#3A4552;font-weight:300;text-wrap:pretty\">\n        <p style=\"margin:0\"><strong style=\"font-weight:600;color:#0D1B2A\">Operating since 1999<\u002Fstrong>, Kivotos of Aegean Travel, is a leading Greek DMC boutique travel company offering vacation packages in Greece, Italy, Turkey, Croatia and Egypt.<\u002Fp>\n        <p style=\"margin:0\">We are proud to be celebrating our 27th birthday – curating unique tailor made experiences for our clients.<\u002Fp>\n        <p style=\"margin:0\"><strong style=\"font-weight:600;color:#0D1B2A\">Kivotos of Aegean Travel<\u002Fstrong> is a business that was founded and built on care. The success of our past 27 years is down to the brilliant people in our community who daily go the extra mile for their customers, and put simply, show more care than anyone else.<\u002Fp>\n        <p style=\"margin:0\">With our boutique approach to business, unparalleled customer service, and unrivalled access to the best unique experiences, we are proud that Kivotos of Aegean remains the trusted choice for bespoke &amp; tailored travel in this captivating region of the Eastern Mediterranean.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"up\" data-delay=\"300\" style=\"margin-top:34px;display:flex;flex-wrap:wrap;gap:24px\">\n        <a href=\"#why\" style=\"font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:#0D1B2A;border-bottom:1px solid #0D1B2A;padding-bottom:6px\" style-hover=\"color:#B48A4E;border-bottom-color:#B48A4E\">Why travel with us<\u002Fa>\n        <a href=\"#contact\" style=\"font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:#0D1B2A;border-bottom:1px solid #0D1B2A;padding-bottom:6px\" style-hover=\"color:#B48A4E;border-bottom-color:#B48A4E\">Talk to a specialist<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"why\" aria-labelledby=\"why-h\" style=\"padding:clamp(110px,13vw,180px) clamp(20px,4vw,56px) 0;max-width:1440px;margin:0 auto\">\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(40px,6vw,96px)\">\n    <div data-reveal=\"up\">\n      <p style=\"margin:0 0 18px;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#8A6A3A;font-weight:600\">Why book with our travel experts<\u002Fp>\n      <h2 id=\"why-h\" style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(36px,4vw,58px);line-height:1.05;color:#0D1B2A\">A Trusted Boutique Greece Travel Agency Since 1999.<\u002Fh2>\n      <p style=\"margin:24px 0 0;font-size:16px;line-height:1.75;color:#3A4552;font-weight:300\">Our travel experts provide personalized service, honest advice, and authentic travel experiences, supported by 5-star reviews on TripAdvisor and continuous 24/7 assistance throughout your journey. From planning to return, your peace of mind is our priority.<\u002Fp>\n      <a href=\"#reviews\" style=\"display:inline-block;margin-top:28px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:#0D1B2A;border-bottom:1px solid #0D1B2A;padding-bottom:6px\" style-hover=\"color:#B48A4E;border-bottom-color:#B48A4E\">Find out more<\u002Fa>\n    <\u002Fdiv>\n    <div id=\"how\" data-reveal=\"up\" data-delay=\"150\">\n      <p style=\"margin:0 0 18px;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#8A6A3A;font-weight:600\">How our  id=\"journal\" aria-labelledby=\"blog-h\" style=\"background:#FBF8F2;padding:clamp(96px,12vw,160px) clamp(20px,4vw,56px)\">\n  <div style=\"max-width:1440px;margin:0 auto\">\n    <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:clamp(36px,4vw,56px)\">\n      <div>\n        <p data-reveal=\"up\" style=\"margin:0 0 18px;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#8A6A3A;font-weight:600\">Travel inspiration<\u002Fp>\n        <h2 id=\"blog-h\" data-reveal=\"up\" data-delay=\"100\" style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(40px,5vw,76px);line-height:1;color:#0D1B2A\">Our recent <em>blog entries<\u002Fem><\u002Fh2>\n      <\u002Fdiv>\n      <a data-reveal=\"up\" href=\"#journal\" style=\"font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:#0D1B2A;border-bottom:1px solid #0D1B2A;padding-bottom:6px\" style-hover=\"color:#B48A4E;border-bottom-color:#B48A4E\">Ask us anything →<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(28px,3vw,44px)\">\n      <sc-for list=\"{{ posts }}\" as=\"b\" hint-placeholder-count=\"3\">\n        <article data-reveal=\"up\" data-delay=\"{{ b.delay }}\">\n          <a href=\"{{ b.href }}\" style=\"display:block;aspect-ratio:4/3;overflow:hidden;background:#E8DCC7\">\n            <img src=\"{{ b.img }}\" alt=\"{{ b.alt }}\" loading=\"lazy\" style=\"width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.4s cubic-bezier(.2,.7,.2,1)\" style-hover=\"transform:scale(1.06)\">\n          <\u002Fa>\n          <time style=\"display:block;margin-top:22px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#8A6A3A;font-weight:600\">{{ b.date }}<\u002Ftime>\n          <h3 style=\"margin:12px 0 0;font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(26px,2.2vw,32px);line-height:1.12;color:#0D1B2A\">{{ b.title }}<\u002Fh3>\n          <p style=\"margin:14px 0 0;font-size:15px;line-height:1.7;color:#4A5562;font-weight:300;text-wrap:pretty\">{{ b.excerpt }}<\u002Fp>\n          <a href=\"{{ b.href }}\" style=\"display:inline-block;margin-top:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:#1F5C8A\" style-hover=\"color:#B48A4E\">Plan this trip →<\u002Fa>\n        <\u002Farticle>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"contact\" aria-labelledby=\"contact-h\" style=\"background:#0D1B2A;color:#F6F1E8;padding:clamp(96px,12vw,160px) clamp(20px,4vw,56px)\">\n  <div style=\"max-width:1440px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:clamp(48px,6vw,110px)\">\n    <div>\n      <p data-reveal=\"up\" style=\"margin:0 0 18px;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#E2C796;font-weight:600\">Complimentary consultation<\u002Fp>\n      <h2 id=\"contact-h\" data-reveal=\"up\" data-delay=\"100\" style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(44px,5.4vw,84px);line-height:.98\">Book Your Free <em style=\"color:#E2C796\">Travel Consultation<\u002Fem><\u002Fh2>\n      <p data-reveal=\"up\" data-delay=\"200\" style=\"margin:28px 0 0;font-size:17px;line-height:1.75;color:#C9CFD6;font-weight:300;max-width:52ch\">For over 26 years, we’ve been crafting tailor-made journeys across Greece and the Eastern Mediterranean. Let us design your perfect Greek escape. Schedule your complimentary consultation today and discover how our boutique expertise and personalized care can bring your travel dreams to life.<\u002Fp>\n      <a data-reveal=\"up\" data-delay=\"300\" href=\"https://calendar.app.google/y9bg4Tj7LbcVRZQt7\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-block;margin-top:34px;background:#E2C796;color:#0D1B2A;font-size:12px;letter-spacing: ont-weight:300\">Outline your dream trip with destinations, interests, and desired experiences.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:22px\">\n        <label style=\"display:flex;flex-direction:column;gap:8px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#AEB6C0\">Name\n          <input name=\"name\" required=\"\" autocomplete=\"name\" style=\"background:transparent;border:none;border-bottom:1px solid rgba(246,241,232,.35);color:#F6F1E8;font:inherit;font-size:16px;letter-spacing:0;text-transform:none;padding:10px 0;outline:none\" style-focus=\"border-bottom-color:#E2C796\">\n        <\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:8px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#AEB6C0\">Email\n          <input name=\"email\" type=\"email\" required=\"\" autocomplete=\"email\" style=\"background:transparent;border:none;border-bottom:1px solid rgba(246,241,232,.35);color:#F6F1E8;font:inherit;font-size:16px;letter-spacing:0;text-transform:none;padding:10px 0;outline:none\" style-focus=\"border-bottom-color:#E2C796\">\n        <\u002Flabel>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:22px\">\n        <label style=\"display:flex;flex-direction:column;gap:8px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#AEB6C0\">Destination\n          <sc-raw-select name=\"destination\" style=\"background:#13263B;border:none;border-bottom:1px solid rgba(246,241,232,.35);color:#F6F1E8;font:inherit;font-size:16px;letter-spacing:0;text-transform:none;padding:10px 0;outline:none\">\n            <option>Greece<\u002Foption><option>Italy<\u002Foption><option>Turkey<\u002Foption><option>Croatia<\u002Foption><option>Egypt<\u002Foption><option>Spain<\u002Foption><option>Portugal<\u002Foption><option>Several – multi-country<\u002Foption>\n          <\u002F title }}<\u002Fspan>\n                <span style=\"font-size:12px;letter-spacing:.1em;color:#5E6670\">{{ t.route }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fa>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n        <a href=\"#contact\" sc-camel-on-click=\"{{ closeDest }}\" style=\"background:#0D1B2A;color:#F6F1E8;font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;padding:17px 24px;transition:background .35s\" style-hover=\"background:#1F5C8A;color:#F6F1E8\">Enquire about {{ m.name }}<\u002Fa>\n        <a href=\"#contact\" sc-camel-on-click=\"{{ closeDest }}\" style=\"border:1px solid #0D1B2A;color:#0D1B2A;font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;padding:16px 24px;transition:background .35s,color .35s\" style-hover=\"background:#0D1B2A;color:#F6F1E8\">Plan a tailor made trip<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"margin-top:auto;display:flex;justify-content:space-between;gap:16px;border-top:1px solid #D9CDB8;padding-top:20px\">\n        <button sc-camel-on-click=\"{{ prevDest }}\" style=\"background:none;border:none;padding:10px 0;font-family:inherit;font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:#0D1B2A;cursor:pointer;min-height:44px\" style-hover=\"color:#B48A4E\">← {{ m.prevName }}<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ nextDest }}\" style=\"background:none;border:none;padding:10px 0;font-family:inherit;font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:#0D1B2A;cursor:pointer;min-height:44px\" style-hover=\"color:#B48A4E\">{{ m.nextName }} →<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<footer style=\"background:#08131F;color:#C9CFD6\">\n  <div style=\"position:relative;overflow:hidden\">\n    <div data-parallax=\"0.18\" style=\"position:absolute;inset:-15% 0\">\n      <img src=\"http ate({ hoverDest: i }),\n        leave: () => this.state.hoverDest === i && this.setState({ hoverDest: -1 }),\n        col: isPhone || (isTablet && i === 0) ? '1 / -1' : isTablet ? 'span 1' : DEST_LAYOUT[i][0], row: isMobile ? 'span 1' : DEST_LAYOUT[i][1],\n        size: i === 0 && !isMobile ? 'clamp(56px,6vw,96px)' : 'clamp(38px,3.6vw,56px)',\n      }; }),\n      stop: e => e.stopPropagation(),\n      destTotal: pad(DESTS.length),\n      m: (() => {\n        const i = this.state.lastDest, d = DESTS[i], det = DETAIL[d.name], n = DESTS.length;\n        return { ...det, name: d.name, img: d.img, num: pad(i + 1), tours_href: d.tours,\n          prevName: DESTS[(i - 1 + n) % n].name, nextName: DESTS[(i + 1) % n].name };\n      })(),\n      modalHidden: this.state.openDest < 0,\n      modalVis: this.state.openDest >= 0 ? 'visible' : 'hidden',\n      modalOp: this.state.openDest >= 0 ? 1 : 0,\n      modalT: this.state.openDest >= 0 ? 'none' : 'translateY(40px) scale(.97)',\n      modalImgT: this.state.openDest >= 0 ? 'scale(1)' : 'scale(1.12)',\n      modalCols: isMobile ? '1fr' : 'minmax(0,5fr) minmax(0,6fr)',\n      modalMaxH: isMobile ? '100%' : '860px',\n      modalImgH: isMobile ? 'min(38vh, 320px)' : '0px',\n      closeDest: () => this.closeDest(),\n      prevDest: () => this.openDest((this.state.lastDest - 1 + DESTS.length) % DESTS.length),\n      nextDest: () => this.openDest((this.state.lastDest + 1) % DESTS.length),\n      pkgCols: isMobile ? '1fr' : 'minmax(0,5fr) minmax(0,7fr)',\n      activePkgTitle: PKGS[pkg].title,\n      packages: PKGS.map((p, i) => ({\n        ...p, num: pad(i + 1), cta: p.cta || 'Enquire',\n        op: i === pkg ? 1 : 0, scale: i === pkg ? 'scale(1)' : 'scale(1.08)',\n        numColor: i === pkg ? '#E2C796' : '#8E99A6', titleColor: i === pkg ? '#F6F1E8' : '#C9CFD6',\n        hover: () => { if (this.state.pkg !== i) this.setState({ pkg: i }); },\n      })),\n      expRef: this.expRef,\n      experiences: EXPS.map((e, i) => ({ ...e, num: pad(i + 1), delay: Math.min(i, 3) * 100, go: () => { if (e.pkg != null) this.setState({ pkg: e.pkg }); } })),\n      featRef: this.featRef,\n      featured: ALL_TOURS.map(t => {\n        const di = DESTS.findIndex(d => d.name === t.dest);\n        return { ...t, aria: 'Open ' + t.title, open: () => this.openDest(di), key: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.openDest(di); } } };\n      }),\n      featPrev: () => this.featRef.current && this.featRef.current.scrollBy({ left: -this.featRef.current.clientWidth * 0.75 }),\n      featNext: () => this.featRef.current && this.featRef.current.scrollBy({ left: this.featRef.current.clientWidth * 0.75 }),\n      expPrev: () => this.expRef.current && this.expRef.current.scrollBy({ left: -this.expRef.current.clientWidth * 0.7 }),\n      expNext: () => this.expRef.current && this.expRef.current.scrollBy({ left: this.expRef.current.clientWidth * 0.7 }),\n      steps: STEPS.map((s, i) => ({ ...s, n: pad(i + 1), delay: i * 120 })),\n      reviews: REVIEWS.map((r, i) => ({\n        ...r, hidden: i !== rev, op: i === rev ? 1 : 0, pe: i === rev ? 'auto' : 'none',\n        pos: i === rev ? 'relative' : 'absolute', t: i === rev ? 'none' : 'translateY(16px)',\n      })),\n      revMinH: isPhone ? '0px' : isMobile ? '520px' : '440px',\n      revCounter: pad(rev + 1) + ' / ' + pad(REVIEWS.length),\n      revPrev: () => this.setState(s => ({ rev: (s.rev - 1 + REVIEWS.length) % REVIEWS.length })),\n      revNext: () => this.setState(s => ({ rev: (s.rev + 1) % REVIEWS.length })),\n      posts: POSTS.map((p, i) => ({ ...p, delay: i * 120 })),\n      footerCols: FOOTER,\n      sent: this.state.sent,\n      submit: e => {\n        e.preventDefault();\n        const f = new FormData(e.target);\n        const body = `Name: ${f.get('name')}\\nEmail: ${f.get('email')}\\nDestination: ${f.get('destination')}\\nTravel dates: ${f.get('dates')}\\n\\n${f.get('message')}`;\n        window.location.href = 'mailto:info@kivoto
